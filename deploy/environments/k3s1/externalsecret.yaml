# Every secret comes from Vault through External Secrets, like the rest of
# k3s1. Nothing secret is in this repository. Populate the Vault key once with
# the command in README.md; the random tokens are generated on your machine.
#
# One Vault key, two Kubernetes Secrets: Postgres only ever sees its own
# password, and the control plane gets a connection string built from it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wslvpn-secrets
  namespace: wslvpn
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: wslvpn-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        WSL_DATABASE_URL: "postgres://wsl:{{ .dbPassword }}@wslvpn-postgres.wslvpn.svc:5432/wsl"
        WSL_OIDC_CLIENT_SECRET: "{{ .oidcClientSecret }}"
        WSL_OPS_SERVICE_TOKEN: "{{ .opsServiceToken }}"
        WSL_GATEWAY_REGISTRATION_TOKEN: "{{ .gatewayRegistrationToken }}"
        WSL_SCIM_SERVICE_TOKEN: "{{ .scimServiceToken }}"
  data:
    - secretKey: dbPassword
      remoteRef: { key: secret/wslvpn/control/prod/config, property: DATABASE_PASSWORD }
    - secretKey: oidcClientSecret
      remoteRef: { key: secret/wslvpn/control/prod/config, property: OIDC_CLIENT_SECRET }
    - secretKey: opsServiceToken
      remoteRef: { key: secret/wslvpn/control/prod/config, property: OPS_SERVICE_TOKEN }
    - secretKey: gatewayRegistrationToken
      remoteRef: { key: secret/wslvpn/control/prod/config, property: GATEWAY_REGISTRATION_TOKEN }
    - secretKey: scimServiceToken
      remoteRef: { key: secret/wslvpn/control/prod/config, property: SCIM_SERVICE_TOKEN }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wslvpn-postgres
  namespace: wslvpn
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: wslvpn-postgres
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: secret/wslvpn/control/prod/config, property: DATABASE_PASSWORD }
