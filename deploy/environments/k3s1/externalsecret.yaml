# Every secret comes from wslvpn's own wslvault tenant
# (01a0f39f-c438-7681-ac92-8ddfe4848d65) through the namespaced `wslvault`
# SecretStore in wslvault-store.yaml — not the cluster-wide store other apps
# share, which serves a different tenant. The key is mount-relative:
# `wslvpn/prod/config` is GET /v1/kv/data/wslvpn/prod/config.
#
# Nothing secret is in this repository. Load the object once with
#   WSLVAULT_TENANT_ID=01a0f39f-c438-7681-ac92-8ddfe4848d65 \
#     deploy/scripts/vault-load-secrets.sh prod
#
# One wslvault object, two Kubernetes Secrets: Postgres only ever sees its own
# password, and the control plane gets a connection string built from it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wslvpn-secrets
  namespace: wslvpn
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: wslvault
  target:
    name: wslvpn-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        WSL_DATABASE_URL: "postgres://wsl:{{ .POSTGRES_PASSWORD }}@wslvpn-postgres.wslvpn.svc:5432/wsl"
        WSL_OIDC_CLIENT_SECRET: "{{ .WSL_OIDC_CLIENT_SECRET }}"
        WSL_OPS_SERVICE_TOKEN: "{{ .WSL_OPS_SERVICE_TOKEN }}"
        WSL_GATEWAY_REGISTRATION_TOKEN: "{{ .WSL_GATEWAY_REGISTRATION_TOKEN }}"
        WSL_SCIM_SERVICE_TOKEN: "{{ .WSL_SCIM_SERVICE_TOKEN }}"
  dataFrom:
    - extract:
        key: wslvpn/prod/config
        # ESO's admission-webhook defaults, spelled out so GitOps never reports
        # a cosmetic diff on them.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wslvpn-postgres
  namespace: wslvpn
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: wslvault
  target:
    name: wslvpn-postgres
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: wslvpn/prod/config
        property: POSTGRES_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
