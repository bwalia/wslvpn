{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wslvpn.serviceAccountName" . }}
  labels:
    {{- include "wslvpn.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The control plane calls no Kubernetes API, so it gets no token.
automountServiceAccountToken: false
{{- end }}
