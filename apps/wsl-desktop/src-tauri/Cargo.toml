[package]
name = "wsl-desktop"
version = "0.1.0"
description = "WSL Zero Trust VPN desktop"
authors = ["WSL"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "wsl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
