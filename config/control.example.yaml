# Local development configuration.
#
# Every secret below may be written as ${ENV_VAR}; the value is read from the
# process environment at startup and an unset variable is a startup error rather
# than a silent empty string. Keep real secrets out of this file.

server:
  listen: "0.0.0.0:8080"
  public_url: "http://localhost:8080"
  # Swagger UI and the OpenAPI document enumerate the whole API surface.
  # Leave this false anywhere that is not a developer's machine.
  expose_docs: true

product:
  namespace: wsl
  display_name: "WSL Zero Trust VPN"

database:
  url: "postgres://wsl:wsl@localhost:5433/wsl"
  max_connections: 20
  min_connections: 2
  acquire_timeout_secs: 5
  idle_timeout_secs: 300
  max_lifetime_secs: 1800

identity:
  # Mints a session for any email with no credential. Refused unless
  # server.public_url is loopback, and the process refuses to start if this is
  # true on a non-loopback deployment.
  dev_login_enabled: true
  oidc:
    issuer: "http://localhost:5556/dex"
    client_id: "wsl-client"
    client_secret: "wsl-client-secret"
    scopes:
      - openid
      - profile
      - email
    redirect_uri: "http://localhost:8080/auth/oidc/callback"
    # Tolerance when comparing an id_token's exp and iat to local time.
    clock_skew_secs: 60
    # Private-use URI schemes a native app may be sent back to. A phone cannot
    # listen on loopback the way the CLI does, so this is how the iOS client
    # completes a login (RFC 8252 section 7.1). Empty means no mobile client
    # can sign in, which is the right default for a deployment without one.
    native_schemes:
      - io.wsl.zerotrust

wireguard:
  default_port: 51820

gitops:
  enabled: true
  path: "./gitops/examples"

security:
  rate_limit:
    # Credential-checking endpoints: the OIDC handshake and dev login.
    auth:
      enabled: true
      requests: 20
      window_secs: 60
    # The authenticated API surface.
    api:
      enabled: true
      requests: 600
      window_secs: 60

bootstrap:
  # Machine provisioning credential (/api/v1/ops).
  ops_service_token: "dev-ops-token-change-me"
  # Shared secret a gateway presents on first enrollment. Each gateway is then
  # issued its own credential, which is what it uses from then on.
  gateway_registration_token: "dev-gateway-token-change-me"
  # SCIM provisioning credential, held by the IdP. Omit it entirely if SCIM is
  # not in use — any previously seeded SCIM token is deactivated at startup.
  scim_service_token: "dev-scim-token-change-me"
  # The only way an administrator comes into existence. Reconciled on every
  # start: adding an address grants the role, removing one takes it away.
  admin_emails:
    - "alice@example.com"
