[package]
name = "wsl-agent"
description = "WSL Zero Trust VPN endpoint agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wsl-agent"
path = "src/main.rs"

[lib]
name = "wsl_agent"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
wsl-crypto = { workspace = true }
wsl-dns = { workspace = true }
url = { workspace = true }
wsl-types = { workspace = true }
dirs = "6"
# geteuid, to decide whether wg-quick needs escalating through sudo.
libc = "0.2"

[dev-dependencies]
axum = { workspace = true }
cucumber = { workspace = true }

# Behaviour specs in tests/features, driven by tests/bdd.rs.
[[test]]
name = "bdd"
harness = false
