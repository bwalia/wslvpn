[package]
name = "wsl-control"
description = "WSL Zero Trust VPN control plane"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "wsl_control"
path = "src/lib.rs"

[[bin]]
name = "wsl-control"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
jsonwebtoken = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }
wsl-crypto = { workspace = true }
wsl-policy = { workspace = true }
wsl-types = { workspace = true }
ipnetwork = "0.20"

[dev-dependencies]
futures = "0.3"
http-body-util = "0.1"
# Generates the throwaway keypairs the id_token tests sign with, so no private
# key is committed. Deliberately not `rsa`: the cargo-audit exception for
# RUSTSEC-2023-0071 is justified by `rsa` never being compiled, and adding it
# here — even as a dev-dependency — would make that justification untrue.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
serde_yaml = { workspace = true }
tower = { workspace = true, features = ["util"] }
