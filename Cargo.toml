[workspace]
resolver = "2"
members = [
    "crates/wsl-types",
    "crates/wsl-crypto",
    "crates/wsl-policy",
    "crates/wsl-control",
    "crates/wsl-gateway",
    "crates/wsl-agent",
    "crates/wsl-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["WSL Zero Trust VPN Contributors"]
repository = "https://github.com/wsl-io/wslvpn"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros", "ipnetwork", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

# Internal crates carry an explicit version alongside the path so they are not
# wildcard requirements: `bans.wildcards = "deny"` exists to stop a `*` from a
# registry resolving to anything, and an unversioned path dep trips it.
wsl-types = { path = "crates/wsl-types", version = "0.1.0" }
wsl-crypto = { path = "crates/wsl-crypto", version = "0.1.0" }
wsl-policy = { path = "crates/wsl-policy", version = "0.1.0" }
