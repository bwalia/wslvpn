# cargo-audit configuration.
#
# cargo-audit reads Cargo.lock, which records a crate's *optional* dependencies
# whether or not the enabled feature set compiles them. An advisory ignored here
# must therefore be justified by evidence that the crate is not built, and that
# evidence has to be re-checked whenever the dependency graph changes.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 - Marvin attack in `rsa`, no fixed version available.
    #
    # `rsa` reaches Cargo.lock only through `sqlx-mysql`. This workspace builds
    # sqlx with default-features = false and the `postgres` driver only, so
    # sqlx-mysql is never compiled and no RSA code is linked into any binary.
    #
    # Verify with:
    #   cargo tree --invert --package rsa            # "nothing to print"
    #   cargo build --workspace 2>&1 | grep mysql    # no output
    #
    # Revisit if a MySQL driver is ever enabled, or if `rsa` publishes a fix.
    # Last checked: 2026-09-01.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0367/0368/0369 - `zip` extraction follows symlinks and keeps
    # SUID bits. zip 3 is only a build-dependency of utoipa-swagger-ui, used to
    # unpack the pinned Swagger UI bundle when wsl-control is compiled; no zip
    # code is linked into any binary and no untrusted archive is ever opened.
    #
    # Verify with:
    #   cargo tree --invert --package zip -e normal   # nothing outside [build-dependencies]
    #
    # The fix (zip >= 9) arrives with utoipa-swagger-ui 10, which needs the
    # utoipa 6 migration. Revisit then. Last checked: 2026-10-24.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",

    # RUSTSEC-2024-0449 - unsafe-libyaml is unmaintained; no vulnerability is
    # reported. It comes in through serde_yaml, which parses operator-owned
    # config and policy files only. Revisit when serde_yaml is replaced.
    # Last checked: 2026-10-24.
    "RUSTSEC-2024-0449",
]
